tailnet:
    manage_all: true
    auth_key: ${TS_AUTHKEY}

provider:
    head_ip: ${HEAD_IP}

auth:
    ssh_user: ${USER}
    ssh_private_key: /home/rafay/.ssh/chia_head

gcp_nodes:
    project: ${GCP_PROJECT}
    zone: me-central1-c
    gcp_worker1:
        machine_type: e2-standard-4      
        count: 1
        image: projects/${GCP_PROJECT}/global/images/chia-worker-prebuilt
        disk_size_gb: 100                 
        spot: false
        ssh_user: ${USER}
        ssh_public_key:  ${GCP_PUBLIC_KEY_PATH}
        ssh_private_key: ${GCP_PRIVATE_KEY_PATH}
        ssh_timeout: 120
        skip_default_setup: true
        setup_commands:
            - "echo 'Using pre-baked CHIA worker image'"
    gcp_worker2:
        machine_type: e2-standard-2      
        count: 1
        image: projects/${GCP_PROJECT}/global/images/riscv-dv-worker
        disk_size_gb: 100                 
        spot: false
        ssh_user: ${USER}
        ssh_public_key:  ${GCP_PUBLIC_KEY_PATH}
        ssh_private_key: ${GCP_PRIVATE_KEY_PATH}
        ssh_timeout: 120
        skip_default_setup: true
        setup_commands:
            - "echo 'Using pre-baked riscv-dv worker image'"        

available_node_types:
    cvw:
        resources: {"wally": 1, "spike": 1, "compare": 1}
        num_workers: 1
        compatible_ips: ["${HEAD_IP}"]
        worker_env_commands:
        - "source /home/rafay/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"
        - "source /home/rafay/miniconda3/WallyGuard/cvw/setup.sh"
    riscv-dv:
        resources: {"generator": 1}
        num_workers: 1
        compatible_ips: ["@gcp_worker2:0"]
        worker_env_commands:
            - "source /home/rafay/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"
            - "export RISCV_DV_ROOT=/home/rafay/miniconda3/riscv-dv"
            - "export PATH=$RISCV_DV_ROOT:$PATH"
    opencode:
        resources: {"opencode_creds": 1}
        worker_setup_commands: ["source ~/.bashrc"]
        num_workers: 1
        compatible_ips: ["@gcp_worker1:0"]
        docker:
            image: ghcr.io/ucb-bar/chia-opencode:latest
            container_name: "chia-opencode-${USER}"               

head_env_commands:
  - "source ~/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"

head_setup_commands:
  - "source ~/miniconda3/etc/profile.d/conda.sh && conda activate chia_env"

head_start_ray_commands:
  - "ray stop"
  - "ray start --head --port=6379 --include-dashboard=True --dashboard-agent-listen-port=0"

worker_start_ray_commands:
  - "ray stop"
  - "ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"